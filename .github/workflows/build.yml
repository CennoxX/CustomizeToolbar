name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: build.bat ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: CustomizeToolbar-${{ matrix.platform }}
          path: bin/${{ matrix.platform }}/CustomizeToolbar.dll
          if-no-files-found: error
